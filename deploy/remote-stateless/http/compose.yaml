# Local fixture: only HTTP is exposed, on host loopback. DB stays private.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: kimetsu
      POSTGRES_USER: kimetsu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a local database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kimetsu -d kimetsu']
      interval: 2s
      timeout: 3s
      retries: 30
  remote:
    build:
      context: ../../..
      dockerfile: deploy/remote-stateless/http/Dockerfile
    environment:
      KIMETSU_REMOTE_STORAGE: postgres
      # Local private fixture only; production must require verified TLS.
      KIMETSU_REMOTE_DATABASE_URL: postgresql://kimetsu:${POSTGRES_PASSWORD:?set a local database password}@postgres/kimetsu?sslmode=disable
      KIMETSU_REMOTE_STORAGE_NAMESPACE: ${KIMETSU_REMOTE_STORAGE_NAMESPACE:-local-team}
      KIMETSU_REMOTE_TOKEN: ${KIMETSU_REMOTE_TOKEN:?set a bearer token}
      KIMETSU_REMOTE_SHARED_ORG: ${KIMETSU_REMOTE_SHARED_ORG:-false}
      KIMETSU_MCP_ENABLE_WRITE_TOOLS: ${KIMETSU_MCP_ENABLE_WRITE_TOOLS:-0}
    ports:
      - '127.0.0.1:8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    init: true
volumes:
  postgres-data:
