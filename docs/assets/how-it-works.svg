<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- card background -->
  <rect x="0" y="0" width="960" height="420" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="none" stroke="#30363d"/>

  <!-- title strip -->
  <circle cx="28" cy="26" r="5" fill="#f85149"/>
  <circle cx="46" cy="26" r="5" fill="#d29922"/>
  <circle cx="64" cy="26" r="5" fill="#22c55e"/>

  <!-- 1. Host agent -->
  <rect x="60" y="80" width="230" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="175" y="115" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Host agent</text>
  <text x="175" y="140" text-anchor="middle" fill="#8b949e" font-size="12">Claude Code · Codex · Pi</text>

  <!-- 2. Broker -->
  <rect x="365" y="80" width="230" height="80" rx="10" fill="#161b22" stroke="#22c55e"/>
  <text x="480" y="115" text-anchor="middle" fill="#22c55e" font-size="17" font-weight="bold">Broker</text>
  <text x="480" y="140" text-anchor="middle" fill="#c9d1d9" font-size="12">ranks every memory</text>

  <!-- 3. Agent run -->
  <rect x="670" y="80" width="230" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="785" y="115" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Agent run</text>
  <text x="785" y="140" text-anchor="middle" fill="#8b949e" font-size="12">solves the task</text>

  <!-- top arrows -->
  <line x1="290" y1="120" x2="358" y2="120" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="324" y="108" text-anchor="middle" fill="#8b949e" font-size="12">context?</text>

  <line x1="595" y1="120" x2="663" y2="120" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629" y="108" text-anchor="middle" fill="#8b949e" font-size="12">top memories</text>

  <!-- 4. brain.db -->
  <ellipse cx="480" cy="280" rx="140" ry="20" fill="#161b22" stroke="#30363d"/>
  <path d="M 340 280 v 64 a 140 20 0 0 0 280 0 v -64" fill="#161b22" stroke="#30363d"/>
  <ellipse cx="480" cy="280" rx="140" ry="20" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="318" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">brain.db</text>
  <text x="480" y="340" text-anchor="middle" fill="#8b949e" font-size="12">one SQLite file · zero LLM calls</text>

  <!-- brain -> broker -->
  <line x1="480" y1="258" x2="480" y2="167" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowDim)"/>
  <text x="466" y="215" text-anchor="end" fill="#8b949e" font-size="12">candidates</text>

  <!-- agent run -> brain (cites) -->
  <path d="M 785 160 C 785 230, 680 262, 626 272" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="768" y="225" fill="#8b949e" font-size="12">cites what helped</text>

  <!-- host -> brain (records) -->
  <path d="M 175 160 C 175 230, 280 262, 334 272" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowDim)"/>
  <text x="98" y="225" fill="#8b949e" font-size="12">records lessons</text>
</svg>
