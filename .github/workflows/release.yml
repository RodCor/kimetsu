# v0.4.7: tag-driven release pipeline.
#
# Push a `vX.Y.Z` tag and this workflow builds release binaries
# for Linux (x86_64), macOS (x86_64 + arm64), and Windows (x86_64),
# then uploads them as assets on the corresponding GitHub Release.
#
# The pipeline runs `kimetsu doctor --skip-mcp` on every artifact
# before uploading — so a broken build fails the release, not the
# user. Manual `cargo publish` to crates.io is a follow-up step
# (we don't auto-publish from CI to keep approvals explicit).
#
# Artifact flavors:
#   * `kimetsu-<version>-<target>-lean` — built with
#     `--no-default-features`: NoopEmbedder + FTS-only retrieval.
#     Smallest binary, no model download on install.
#   * `kimetsu-<version>-<target>-embeddings` — opt-in semantic build.
#     Larger binary; fastembed-rs + ONNX runtime linked statically
#     when possible. Not built for x86_64-apple-darwin because `ort`
#     does not publish a prebuilt ONNX Runtime for that target.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch: {}

permissions:
  contents: write  # needed to upload release assets

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.flavor }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, flavor: lean,       extra_features: "--no-default-features" }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, flavor: embeddings, extra_features: "--features embeddings,pi,openclaw" }
          # macOS Intel
          - { os: macos-15-intel, target: x86_64-apple-darwin,     flavor: lean,       extra_features: "--no-default-features" }
          # macOS Apple Silicon
          - { os: macos-14,       target: aarch64-apple-darwin,     flavor: lean,       extra_features: "--no-default-features" }
          - { os: macos-14,       target: aarch64-apple-darwin,     flavor: embeddings, extra_features: "--features embeddings,pi,openclaw" }
          # Windows
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   flavor: lean,       extra_features: "--no-default-features" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   flavor: embeddings, extra_features: "--features embeddings,pi,openclaw" }
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-${{ matrix.flavor }}

      - name: build kimetsu-cli
        run: |
          cargo build --release --locked -p kimetsu-cli --target ${{ matrix.target }} ${{ matrix.extra_features }}

      - name: smoke-test built binary (doctor --skip-mcp)
        shell: bash
        env:
          KIMETSU_USER_BRAIN: "0"
        run: |
          if [ "${{ matrix.flavor }}" = "lean" ]; then
            BINARY="target/${{ matrix.target }}/release/kimetsu"
          else
            BINARY="target/${{ matrix.target }}/release/kimetsu"
          fi
          [ "${{ runner.os }}" = "Windows" ] && BINARY="${BINARY}.exe"
          "$BINARY" --version
          # doctor expects a workspace; the cloned repo is one.
          "$BINARY" doctor --skip-mcp --workspace .

      - name: package archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="kimetsu-${VERSION}-${{ matrix.target }}-${{ matrix.flavor }}"
          mkdir -p "dist/$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/kimetsu.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/kimetsu" "dist/$NAME/"
          fi
          MIT_LICENSE="LICENSE-MIT"
          APACHE_LICENSE="LICENSE-APACHE"
          [ -f "$MIT_LICENSE" ] || MIT_LICENSE="docs/LICENSE-MIT"
          [ -f "$APACHE_LICENSE" ] || APACHE_LICENSE="docs/LICENSE-APACHE"
          cp "$MIT_LICENSE" "$APACHE_LICENSE" README.md "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path $NAME -DestinationPath $NAME.zip"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimetsu-${{ matrix.target }}-${{ matrix.flavor }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: assemble release notes
        id: notes
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull CHANGELOG.md section for this version, if present.
          if [ -f CHANGELOG.md ] && grep -q "^## v${VERSION}" CHANGELOG.md; then
            awk -v v="v${VERSION}" '
              BEGIN { include = 0 }
              /^## / {
                if (include == 1) exit
                if ($2 == v) include = 1
                else next
              }
              include == 1 { print }
            ' CHANGELOG.md > release-notes.md
          else
            echo "Release v${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "Generated from the kimetsu monorepo. See README.md for installation + usage." >> release-notes.md
          fi

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    # Serial cargo publish to crates.io after the binary
    # matrix + GH Release succeed. Gated on:
    #   (a) tag push (handled by `if`)
    #   (b) the `release` job succeeding (handled by `needs`)
    #   (c) CARGO_REGISTRY_TOKEN secret being set on the repo
    #
    # Crate publish order matches the user-facing dep DAG:
    #   kimetsu-core   (no kimetsu deps)
    #   kimetsu-brain  (needs core)
    #   kimetsu-agent  (needs brain + core)
    #   kimetsu-chat   (needs agent + brain + core)
    #   kimetsu-cli    (needs agent + brain + chat + core)
    #
    # `cargo publish --no-verify` skips the local rebuild that
    # cargo does by default — the binary matrix already verified
    # everything builds clean against this tag. `sleep 30` between
    # publishes gives crates.io's index time to propagate so the
    # next crate can resolve the just-published dep.
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Gated on the repo variable PUBLISH_CRATES == 'true' (in addition to
    # the tag push). Left unset for the v0.7.0 smoke-test release so the
    # GitHub Release + binaries ship without a permanent crates.io publish.
    # To enable crates.io publishing: `gh variable set PUBLISH_CRATES --body true`
    # (or set it in repo Settings → Variables), then re-run / re-tag.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CRATES == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: verify CARGO_REGISTRY_TOKEN secret is set
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Skipping crates.io publish."
            echo "::error::Add the secret via: gh secret set CARGO_REGISTRY_TOKEN"
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN is set (length: ${#CARGO_REGISTRY_TOKEN})"

      - name: publish kimetsu-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-core --no-verify
          sleep 30

      - name: publish kimetsu-brain
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-brain --no-verify
          sleep 30

      - name: publish kimetsu-agent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-agent --no-verify
          sleep 30

      - name: publish kimetsu-chat
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-chat --no-verify
          sleep 30

      - name: publish kimetsu-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-cli --no-verify

      - name: summary
        run: |
          echo "## crates.io publish — v${GITHUB_REF_NAME#v} ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published 5 crates (kimetsu-harbor-rs intentionally not published; see Cargo.toml):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for c in kimetsu-core kimetsu-brain kimetsu-agent kimetsu-chat kimetsu-cli; do
            echo "- [\`${c}\`](https://crates.io/crates/${c}/${GITHUB_REF_NAME#v})" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can now install with:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "cargo install kimetsu-cli  # lean build" >> $GITHUB_STEP_SUMMARY
          echo "cargo install kimetsu-cli --features embeddings  # semantic build where ort supports the target" >> $GITHUB_STEP_SUMMARY
          echo "kimetsu update --check" >> $GITHUB_STEP_SUMMARY
          echo "kimetsu uninstall --dry-run" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  publish-npm:
    # Publish the `kimetsu` npm package after the binary matrix + GH Release
    # succeed. esbuild/turbo style: one per-platform package per target (lean
    # binary inside, os/cpu set) plus the main `kimetsu` package that lists
    # them as optionalDependencies. npm installs only the matching platform
    # package; the bin/cli.js launcher execs its binary. No postinstall.
    #
    # Embeddings is NOT shipped as a package — it's fetched on demand by the
    # launcher when KIMETSU_NPM_FLAVOR=embeddings is set (see npm/kimetsu).
    #
    # Gated, like publish-crates, on:
    #   (a) tag push (handled by `if`)
    #   (b) the repo variable PUBLISH_NPM == 'true'
    #   (c) the NPM_TOKEN secret being set
    # To enable: `gh variable set PUBLISH_NPM --body true` and
    # `gh secret set NPM_TOKEN` (an npm automation token).
    name: publish to npm
    needs: release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: verify NPM_TOKEN secret is set
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Skipping npm publish."
            echo "::error::Add the secret via: gh secret set NPM_TOKEN"
            exit 1
          fi
          echo "NPM_TOKEN is set (length: ${#NODE_AUTH_TOKEN})"

      - name: assemble + publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # npm-key  target-triple  os  cpu  binname  ext
          PLATFORMS=(
            "linux-x64    x86_64-unknown-linux-gnu  linux   x64    kimetsu      tar.gz"
            "darwin-x64   x86_64-apple-darwin       darwin  x64    kimetsu      tar.gz"
            "darwin-arm64 aarch64-apple-darwin      darwin  arm64  kimetsu      tar.gz"
            "win32-x64    x86_64-pc-windows-msvc     win32   x64    kimetsu.exe  zip"
          )

          mkdir -p stage
          for row in "${PLATFORMS[@]}"; do
            read -r key target osv cpuv binname ext <<<"$row"
            stem="kimetsu-${VERSION}-${target}-lean"
            archive="dist/kimetsu-${target}-lean/${stem}.${ext}"
            if [ ! -f "$archive" ]; then
              echo "::error::missing lean artifact for ${target}: ${archive}"
              exit 1
            fi

            tmp="$(mktemp -d)"
            if [ "$ext" = "zip" ]; then
              # PowerShell `Compress-Archive` writes ZIP entries with backslash
              # separators; Info-ZIP `unzip` flattens those into a literal
              # filename so the binary can't be found by path. `7z` (preinstalled
              # on ubuntu-latest) normalizes backslashes into real directories.
              7z x -y -o"$tmp" "$archive" >/dev/null
            else
              tar -xf "$archive" -C "$tmp"
            fi

            pkgdir="stage/${key}"
            mkdir -p "$pkgdir/bin"
            # Prefer the expected layout (`<stem>/<binname>`), then fall back to
            # a recursive search so the step is robust to archive quirks.
            if [ -f "$tmp/${stem}/${binname}" ]; then
              src="$tmp/${stem}/${binname}"
            elif [ -f "$tmp/${binname}" ]; then
              src="$tmp/${binname}"
            else
              # Exact match, then suffix match — the latter catches a
              # backslash-flattened basename like `<stem>\kimetsu.exe` if some
              # extractor still mangles the Windows archive.
              src="$(find "$tmp" -type f -name "${binname}" | head -n1)"
              [ -z "$src" ] && src="$(find "$tmp" -type f -name "*${binname}" | head -n1)"
            fi
            if [ -z "${src:-}" ] || [ ! -f "$src" ]; then
              echo "::error::binary ${binname} not found inside ${archive}"
              echo "::error::extracted tree:"; find "$tmp" -maxdepth 3 -print
              exit 1
            fi
            cp "$src" "$pkgdir/bin/${binname}"
            [ "$ext" = "zip" ] || chmod +x "$pkgdir/bin/${binname}"

            node -e '
              const fs = require("fs");
              const [dir, name, version, osv, cpuv] = process.argv.slice(1);
              fs.writeFileSync(dir + "/package.json", JSON.stringify({
                name,
                version,
                description: name + " — prebuilt kimetsu binary",
                repository: { type: "git", url: "git+https://github.com/RodCor/kimetsu.git" },
                license: "MIT OR Apache-2.0",
                os: [osv],
                cpu: [cpuv],
                files: ["bin"],
              }, null, 2) + "\n");
            ' "$pkgdir" "@kimetsu-ai/${key}" "$VERSION" "$osv" "$cpuv"

            # Idempotent: skip if this exact version is already on npm, so a
            # re-run after a partial failure doesn't choke on EPUBLISHCONFLICT.
            if npm view "@kimetsu-ai/${key}@${VERSION}" version >/dev/null 2>&1; then
              echo "skip: @kimetsu-ai/${key}@${VERSION} already published"
            else
              echo "publishing @kimetsu-ai/${key}@${VERSION}"
              ( cd "$pkgdir" && npm publish --access public )
            fi
          done

      - name: stamp + publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const p = "npm/kimetsu/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = version;
            for (const k of Object.keys(j.optionalDependencies || {})) {
              j.optionalDependencies[k] = version;
            }
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          ' "$VERSION"
          if npm view "kimetsu-ai@${VERSION}" version >/dev/null 2>&1; then
            echo "skip: kimetsu-ai@${VERSION} already published"
          else
            echo "publishing kimetsu-ai@${VERSION}"
            ( cd npm/kimetsu && npm publish --access public )
          fi

      - name: summary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "## npm publish — v${VERSION} ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published the main package + 4 platform packages:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [\`kimetsu-ai\`](https://www.npmjs.com/package/kimetsu-ai/v/${VERSION})" >> $GITHUB_STEP_SUMMARY
          for k in linux-x64 darwin-x64 darwin-arm64 win32-x64; do
            echo "- [\`@kimetsu-ai/${k}\`](https://www.npmjs.com/package/@kimetsu-ai/${k}/v/${VERSION})" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can now install with:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "npm install -g kimetsu-ai  # lean build" >> $GITHUB_STEP_SUMMARY
          echo "KIMETSU_NPM_FLAVOR=embeddings npm install -g kimetsu-ai  # semantic build" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
