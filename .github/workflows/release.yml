# v0.4.7: tag-driven release pipeline.
#
# Push a `v0.4.x` tag and this workflow builds release binaries
# for Linux (x86_64), macOS (x86_64 + arm64), and Windows
# (x86_64), then uploads them as assets on the corresponding
# GitHub Release.
#
# The pipeline runs `kimetsu doctor --skip-mcp` on every artifact
# before uploading — so a broken build fails the release, not the
# user. Manual `cargo publish` to crates.io is a follow-up step
# (we don't auto-publish from CI to keep approvals explicit).
#
# Two artifact sets per platform:
#   * `kimetsu-<version>-<target>-lean`     — default Cargo build,
#     NoopEmbedder + FTS-only retrieval. Smallest binary, no model
#     download on install.
#   * `kimetsu-<version>-<target>-embeddings` — built with
#     `--features embeddings`. Larger binary; fastembed-rs +
#     ONNX runtime linked statically when possible.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch: {}

permissions:
  contents: write  # needed to upload release assets

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.flavor }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, flavor: lean,       extra_features: ""               }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, flavor: embeddings, extra_features: "--features embeddings" }
          # macOS Apple Silicon
          #
          # v0.4.11: x86_64-apple-darwin (macos-13) runners were
          # dropped from the matrix. As of late 2026 those runners
          # are deprecated + under-provisioned on GitHub's free
          # tier and the jobs queue indefinitely. Apple Silicon
          # is the dominant Mac architecture now; users on Intel
          # Macs can `cargo install kimetsu-cli` from source.
          - { os: macos-14,       target: aarch64-apple-darwin,     flavor: lean,       extra_features: ""               }
          - { os: macos-14,       target: aarch64-apple-darwin,     flavor: embeddings, extra_features: "--features embeddings" }
          # Windows
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   flavor: lean,       extra_features: ""               }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   flavor: embeddings, extra_features: "--features embeddings" }
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-${{ matrix.flavor }}

      - name: build kimetsu-cli
        run: |
          cargo build --release -p kimetsu-cli --target ${{ matrix.target }} ${{ matrix.extra_features }}

      - name: build kimetsu-harbor-agent
        # `kimetsu-harbor-agent` lives in kimetsu-harbor-rs's `[[bin]]`.
        # Always build the lean variant — the harbor binary doesn't
        # use the embeddings feature.
        if: matrix.flavor == 'lean'
        run: |
          cargo build --release -p kimetsu-harbor-rs --bin kimetsu-harbor-agent --target ${{ matrix.target }}

      - name: smoke-test built binary (doctor --skip-mcp)
        shell: bash
        run: |
          if [ "${{ matrix.flavor }}" = "lean" ]; then
            BINARY="target/${{ matrix.target }}/release/kimetsu"
          else
            BINARY="target/${{ matrix.target }}/release/kimetsu"
          fi
          [ "${{ runner.os }}" = "Windows" ] && BINARY="${BINARY}.exe"
          "$BINARY" --version
          # doctor expects a workspace; the cloned repo is one.
          "$BINARY" doctor --skip-mcp --workspace . || true

      - name: package archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="kimetsu-${VERSION}-${{ matrix.target }}-${{ matrix.flavor }}"
          mkdir -p "dist/$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/kimetsu.exe" "dist/$NAME/"
            if [ "${{ matrix.flavor }}" = "lean" ]; then
              cp "target/${{ matrix.target }}/release/kimetsu-harbor-agent.exe" "dist/$NAME/"
            fi
          else
            cp "target/${{ matrix.target }}/release/kimetsu" "dist/$NAME/"
            if [ "${{ matrix.flavor }}" = "lean" ]; then
              cp "target/${{ matrix.target }}/release/kimetsu-harbor-agent" "dist/$NAME/"
            fi
          fi
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path $NAME -DestinationPath $NAME.zip"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimetsu-${{ matrix.target }}-${{ matrix.flavor }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: assemble release notes
        id: notes
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull CHANGELOG.md section for this version, if present.
          if [ -f CHANGELOG.md ] && grep -q "^## v${VERSION}" CHANGELOG.md; then
            awk -v v="v${VERSION}" '
              BEGIN { include = 0 }
              /^## / {
                if (include == 1) exit
                if ($2 == v) include = 1
                else next
              }
              include == 1 { print }
            ' CHANGELOG.md > release-notes.md
          else
            echo "Release v${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "Generated from the kimetsu monorepo. See README.md for installation + usage." >> release-notes.md
          fi

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    # v0.4.9: serial cargo publish to crates.io after the binary
    # matrix + GH Release succeed. Gated on:
    #   (a) tag push (handled by `if`)
    #   (b) the `release` job succeeding (handled by `needs`)
    #   (c) CARGO_REGISTRY_TOKEN secret being set on the repo
    #
    # v0.4.10: kimetsu-harbor-rs is intentionally NOT published.
    # It's marked `publish = false` in its Cargo.toml because:
    #   * `kimetsu-cli` (the user-facing binary that powers
    #     `cargo install kimetsu-cli`) doesn't depend on it.
    #   * It's a Terminal-Bench operator tool, still iterating
    #     internally; publishing implies backward-compat we don't
    #     want to commit to yet.
    # The `kimetsu-harbor-agent` binary still ships in every
    # GH Release archive (built by the lean matrix above), so
    # benchmark users can grab it from there.
    #
    # Crate publish order matches the user-facing dep DAG:
    #   kimetsu-core   (no kimetsu deps)
    #   kimetsu-brain  (needs core)
    #   kimetsu-agent  (needs brain + core)
    #   kimetsu-chat   (needs agent + brain + core)
    #   kimetsu-cli    (needs agent + brain + chat + core)
    #
    # `cargo publish --no-verify` skips the local rebuild that
    # cargo does by default — the binary matrix already verified
    # everything builds clean against this tag. `sleep 30` between
    # publishes gives crates.io's index time to propagate so the
    # next crate can resolve the just-published dep.
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Gated on the repo variable PUBLISH_CRATES == 'true' (in addition to
    # the tag push). Left unset for the v0.7.0 smoke-test release so the
    # GitHub Release + binaries ship without a permanent crates.io publish.
    # To enable crates.io publishing: `gh variable set PUBLISH_CRATES --body true`
    # (or set it in repo Settings → Variables), then re-run / re-tag.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CRATES == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: verify CARGO_REGISTRY_TOKEN secret is set
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Skipping crates.io publish."
            echo "::error::Add the secret via: gh secret set CARGO_REGISTRY_TOKEN"
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN is set (length: ${#CARGO_REGISTRY_TOKEN})"

      - name: publish kimetsu-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-core --no-verify
          sleep 30

      - name: publish kimetsu-brain
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-brain --no-verify
          sleep 30

      - name: publish kimetsu-agent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-agent --no-verify
          sleep 30

      - name: publish kimetsu-chat
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-chat --no-verify
          sleep 30

      - name: publish kimetsu-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p kimetsu-cli --no-verify

      - name: summary
        run: |
          echo "## crates.io publish — v${GITHUB_REF_NAME#v} ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published 5 crates (kimetsu-harbor-rs intentionally not published; see Cargo.toml):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for c in kimetsu-core kimetsu-brain kimetsu-agent kimetsu-chat kimetsu-cli; do
            echo "- [\`${c}\`](https://crates.io/crates/${c}/${GITHUB_REF_NAME#v})" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can now install with:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "cargo install kimetsu-cli" >> $GITHUB_STEP_SUMMARY
          echo "cargo install kimetsu-cli --features embeddings" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
