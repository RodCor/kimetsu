[workspace]
members = [
    "crates/kimetsu-agent",
    "crates/kimetsu-brain",
    "crates/kimetsu-chat",
    "crates/kimetsu-cli",
    "crates/kimetsu-core",
    "crates/kimetsu-e2e",
    "crates/kimetsu-harbor-rs",
]
resolver = "3"

[workspace.package]
# v0.4.7: distribution-ready metadata. Each member crate picks up
# everything below except the per-crate `description`, `keywords`,
# and `categories` which live in each `[package]` block since
# crates.io enforces them per crate.
version = "0.5.5"
edition = "2024"
# Rust ecosystem dual-license (matches tokio, serde, fastembed-rs,
# etc.). UNLICENSED would block crates.io entirely.
license = "MIT OR Apache-2.0"
authors = ["Kimetsu contributors"]
repository = "https://github.com/RodCor/kimetsu"
homepage = "https://github.com/RodCor/kimetsu"
documentation = "https://github.com/RodCor/kimetsu/tree/main/docs"
readme = "README.md"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1", features = ["serde"] }
