[package]
name = "kimetsu-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Server-hosted Kimetsu brain over HTTP MCP, keyed by repository."
keywords = ["kimetsu", "mcp", "server", "brain", "http"]
categories = ["command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "kimetsu-remote"
path = "src/main.rs"

[features]
# Lean by default (like kimetsu-cli) so a workspace build doesn't unify
# `kimetsu-brain/embeddings` on for every crate. Build/run the server with
# `--features embeddings` for semantic (sqlite-vec) retrieval; the release
# artifacts and `cargo install kimetsu-remote --features embeddings` do this.
default = []
embeddings = ["kimetsu-brain/embeddings"]
# Optional in-process HTTPS (rustls + ring). Off by default — the recommended
# deployment terminates TLS at a reverse proxy. `--features tls` enables
# `--tls-cert`/`--tls-key`.
tls = ["dep:axum-server", "dep:rustls"]

[dependencies]
kimetsu-core = { path = "../kimetsu-core" }
kimetsu-brain = { path = "../kimetsu-brain" }
kimetsu-chat = { path = "../kimetsu-chat" }
tokio = { workspace = true }
axum = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
subtle = "2"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
