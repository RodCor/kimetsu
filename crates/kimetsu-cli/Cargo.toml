[package]
name = "kimetsu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Top-level `kimetsu` binary: chat client, MCP sidecar, bridge for Claude Code / Codex, brain admin tools, doctor."
keywords = ["kimetsu", "cli", "ai", "chat", "agent"]
categories = ["command-line-utilities", "development-tools"]

[features]
# v0.4.8: re-export the brain crate's `embeddings` feature so
# `cargo install kimetsu-cli --features embeddings` propagates down
# the dep chain. Without this, `cargo` complains about an unknown
# feature on `kimetsu-cli` — Cargo doesn't auto-forward features
# across workspace dep chains, even when the consumer wires the
# upstream feature explicitly.
#
# Fan-out covers every kimetsu-* dep that kimetsu-cli actually
# imports (kimetsu-harbor-rs is NOT among them — that crate's
# binary is built separately by the release workflow).
# v0.7.3: keep the default install lean so `cargo install kimetsu-cli`
# works on every supported target. Embeddings remain available with
# `--features embeddings` on targets where `ort` ships prebuilts.
default = []
embeddings = [
    "dep:interprocess",
    "kimetsu-agent/embeddings",
    "kimetsu-brain/embeddings",
    "kimetsu-chat/embeddings",
]
pi = ["kimetsu-chat/pi"]
openclaw = ["kimetsu-chat/openclaw"]

[[bin]]
name = "kimetsu"
path = "src/main.rs"

[dependencies]
clap.workspace = true
kimetsu-agent = { path = "../kimetsu-agent", version = "2.5.1" }
kimetsu-brain = { path = "../kimetsu-brain", version = "2.5.1" }
kimetsu-chat = { path = "../kimetsu-chat", version = "2.5.1" }
kimetsu-core = { path = "../kimetsu-core", version = "2.5.1" }
# v0.4.6: `kimetsu doctor` serializes its report struct so --json
# output can be piped into CI / hooks.
flate2 = "1"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
time.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
interprocess = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

# Daemon spawn hygiene: clear HANDLE_FLAG_INHERIT on our std handles before
# spawning the long-lived embed daemon, so it can't hold the hook's stdout
# pipe open and stall the harness (see embed_daemon::client).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
