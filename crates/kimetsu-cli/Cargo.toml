[package]
name = "kimetsu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Top-level `kimetsu` binary: chat client, MCP sidecar, bridge for Claude Code / Codex, brain admin tools, doctor."
keywords = ["kimetsu", "cli", "ai", "chat", "agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kimetsu"
path = "src/main.rs"

[dependencies]
clap.workspace = true
kimetsu-agent = { path = "../kimetsu-agent" }
kimetsu-brain = { path = "../kimetsu-brain" }
kimetsu-chat = { path = "../kimetsu-chat" }
kimetsu-core = { path = "../kimetsu-core" }
# v0.4.6: `kimetsu doctor` serializes its report struct so --json
# output can be piped into CI / hooks.
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
