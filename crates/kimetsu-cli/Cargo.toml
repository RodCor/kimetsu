[package]
name = "kimetsu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Top-level `kimetsu` binary: chat client, MCP sidecar, bridge for Claude Code / Codex, brain admin tools, doctor."
keywords = ["kimetsu", "cli", "ai", "chat", "agent"]
categories = ["command-line-utilities", "development-tools"]

[features]
# v0.4.8: re-export the brain crate's `embeddings` feature so
# `cargo install kimetsu-cli --features embeddings` propagates down
# the dep chain. Without this, `cargo` complains about an unknown
# feature on `kimetsu-cli` — Cargo doesn't auto-forward features
# across workspace dep chains, even when the consumer wires the
# upstream feature explicitly.
#
# Fan-out covers every kimetsu-* dep that kimetsu-cli actually
# imports (kimetsu-harbor-rs is NOT among them — that crate's
# binary is built separately by the release workflow).
default = []
embeddings = [
    "kimetsu-agent/embeddings",
    "kimetsu-brain/embeddings",
    "kimetsu-chat/embeddings",
]

[[bin]]
name = "kimetsu"
path = "src/main.rs"

[dependencies]
clap.workspace = true
kimetsu-agent = { path = "../kimetsu-agent", version = "0.5.3" }
kimetsu-brain = { path = "../kimetsu-brain", version = "0.5.3" }
kimetsu-chat = { path = "../kimetsu-chat", version = "0.5.3" }
kimetsu-core = { path = "../kimetsu-core", version = "0.5.3" }
# v0.4.6: `kimetsu doctor` serializes its report struct so --json
# output can be piped into CI / hooks.
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
