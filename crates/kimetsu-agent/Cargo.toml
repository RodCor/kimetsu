[package]
name = "kimetsu-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Transport-neutral agent runtime for kimetsu: tools, prompts, verify-loop, providers (claude_code, anthropic, openai)."
keywords = ["kimetsu", "agent", "llm", "anthropic", "openai"]
categories = ["development-tools"]

[features]
# v0.4.8: `kimetsu-agent` pulls `kimetsu-brain` for retrieval inside
# the pipeline's coding run. Forwarding `embeddings` here lets the
# top-level `kimetsu-cli --features embeddings` build pull a fully
# embedder-aware pipeline path.
default = []
embeddings = ["kimetsu-brain/embeddings"]

[dependencies]
aws-credential-types.workspace = true
aws-sigv4.workspace = true
aws-smithy-runtime-api.workspace = true
blake3.workspace = true
http.workspace = true
kimetsu-brain = { path = "../kimetsu-brain", version = "2.5.2" }
kimetsu-core = { path = "../kimetsu-core", version = "2.5.2" }
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
time.workspace = true
