[package]
name = "kimetsu-bus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "ADR 0001 F2 memory bus: iroh transport, static roster, request_pack."
keywords = ["kimetsu", "iroh", "p2p", "memory"]
categories = ["network-programming"]

[features]
# The measurement example and the in-process relay tests skip TLS verify
# for a private certificate. That API exists only with iroh's test-utils.
# `kimetsu-cli`'s `network` feature depends on this crate with
# `default-features = false`, so the release binary does not compile it.
default = ["insecure-relay"]
insecure-relay = ["iroh/test-utils", "iroh-relay/test-utils"]

[dependencies]
blake3.workspace = true
ed25519-dalek = "2"
getrandom = { version = "0.3", features = ["std"] }
iroh = "1.4.1"
iroh-mdns-address-lookup = "0.6.1"
iroh-relay = "1.4.1"
kimetsu-brain = { path = "../kimetsu-brain", version = "2.11.0" }
kimetsu-core = { path = "../kimetsu-core", version = "2.11.0" }
# Examples call `kimetsu_sdk::context`. The library does not depend on
# kimetsu-sdk: that crate depends on this one to forward `request_pack`.
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# In-process relay for tests. Not linked into the library's default build
# for dependents; cargo enables it when this crate's tests are built.
iroh = { version = "1.4.1", features = ["test-utils"] }
# Path only, no version. kimetsu-sdk optionally depends on this crate, so a
# versioned dev-dependency is a crates.io publish cycle. Cargo strips a
# versionless path dev-dependency from the published manifest. Workspace
# tests and the f3_hotpath example still resolve this path.
kimetsu-sdk = { path = "../kimetsu-sdk", features = ["bus"] }
serde_json.workspace = true
tempfile = "3"
