[package]
name = "kimetsu-harbor-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Terminal-Bench / Harbor transport adapter for kimetsu. Ships the `kimetsu-harbor-agent` benchmark binary."
keywords = ["kimetsu", "harbor", "terminal-bench", "benchmark"]
categories = ["development-tools"]
# v0.4.10: this crate is benchmark-only and clone-and-build only.
# `kimetsu-cli` (the user-facing binary) doesn't depend on it, so
# end users never need it from crates.io. Publishing it would imply
# a backward-compat commitment for a Terminal-Bench operator tool
# that's still iterating internally. The release pipeline still
# builds + ships the `kimetsu-harbor-agent` binary in each GH
# Release archive, so benchmark users can grab it from there.
publish = false

[features]
# v0.4.8: forwarded so the `kimetsu-cli --features embeddings`
# umbrella build keeps the harbor binary on the same retrieval
# stack as chat. Benchmark runs that want the lean lexical-only
# build can keep using the default feature set.
default = []
embeddings = ["kimetsu-brain/embeddings"]

# Terminal-Bench / Harbor transport adapter for kimetsu.
#
# Owns the line-oriented JSON-RPC transport and the dedicated
# `kimetsu-harbor-agent` benchmark binary. The product CLI lives in
# `kimetsu-cli` and does not depend on this crate.
#
# Library name uses `_rs` suffix to avoid historical collision with
# the python Harbor adapter directory; that adapter moved to the
# internal kimetsu-bench repo in v0.5.5 along with the benchmark
# orchestrator.

[dependencies]
clap.workspace = true
kimetsu-agent = { path = "../kimetsu-agent", version = "0.7.0" }
kimetsu-brain = { path = "../kimetsu-brain", version = "0.7.0" }
kimetsu-core = { path = "../kimetsu-core", version = "0.7.0" }
serde.workspace = true
serde_json.workspace = true
