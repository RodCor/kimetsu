[package]
name = "kimetsu-harbor-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Terminal-Bench / Harbor transport adapter for kimetsu. Ships the `kimetsu-harbor-agent` benchmark binary."
keywords = ["kimetsu", "harbor", "terminal-bench", "benchmark"]
categories = ["development-tools"]

# Terminal-Bench / Harbor transport adapter for kimetsu.
#
# Owns the line-oriented JSON-RPC transport and the dedicated
# `kimetsu-harbor-agent` benchmark binary. The product CLI lives in
# `kimetsu-cli` and does not depend on this crate.
#
# Library name uses `_rs` suffix to avoid collision with the python
# adapter directory `kimetsu_harbor/` at the workspace root.

[dependencies]
clap.workspace = true
kimetsu-agent = { path = "../kimetsu-agent" }
kimetsu-brain = { path = "../kimetsu-brain" }
kimetsu-core = { path = "../kimetsu-core" }
serde.workspace = true
serde_json.workspace = true
