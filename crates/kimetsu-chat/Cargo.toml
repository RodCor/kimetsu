[package]
name = "kimetsu-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Interactive REPL chat client + MCP sidecar + cross-harness bridge for kimetsu. Installs into Claude Code and Codex as a brain-managed memory layer."
keywords = ["kimetsu", "chat", "mcp", "claude-code", "codex"]
categories = ["development-tools", "command-line-utilities"]

[features]
# v0.4.8: passthrough so `kimetsu-cli --features embeddings` can
# light up semantic retrieval inside the chat REPL. Bare
# `kimetsu-chat` consumers (none today, but the bridge plugin
# would qualify) can also opt in directly.
default = []
embeddings = ["kimetsu-brain/embeddings"]

# Interactive REPL transport for kimetsu.
#
# Wraps the protocol-agnostic agent core (`kimetsu-agent`) in a
# stdin/stdout loop with slash commands, local-filesystem tool runtime,
# a running cost meter, and per-session goal tracking for MP-18's
# brain-powered iterative verify.
#
# Crucially: does NOT depend on kimetsu-harbor-rs. The chat client is
# completely independent of Terminal-Bench / Harbor — a real product
# surface, not a benchmark harness.

[dependencies]
kimetsu-agent = { path = "../kimetsu-agent", version = "0.5.4" }
kimetsu-brain = { path = "../kimetsu-brain", version = "0.5.4" }
kimetsu-core = { path = "../kimetsu-core", version = "0.5.4" }
base64.workspace = true
crossterm.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
