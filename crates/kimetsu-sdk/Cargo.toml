[package]
name = "kimetsu-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "In-process Rust entry for the ADR 0001 store operations. Not @kimetsu-ai/sdk."
keywords = ["kimetsu", "memory", "sdk"]
categories = ["database"]

[features]
# Off by default. `cargo test -p kimetsu-remote` must not compile kimetsu-bus:
# that library calls CaTlsConfig::insecure_skip_verify, which iroh-relay
# exposes only under cfg(test) or its test-utils feature. Bus tests turn
# test-utils on; the lean remote suite does not.
bus = ["dep:kimetsu-bus"]

[dependencies]
kimetsu-brain = { path = "../kimetsu-brain", version = "2.11.0" }
# `default-features = false` keeps iroh's test-only TLS skip out of any
# binary that enables `bus` (the release `kimetsu` build does).
kimetsu-bus = { path = "../kimetsu-bus", version = "2.11.0", optional = true, default-features = false }
kimetsu-core = { path = "../kimetsu-core", version = "2.11.0" }

[dev-dependencies]
tempfile = "3"
